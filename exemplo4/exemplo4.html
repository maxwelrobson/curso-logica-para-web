<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        alert("Cálculos de dois números!")
        var n1 = +prompt("Digite o primeiro número: ")
        var n2 = +prompt("Digite o segundo número: ")

        var soma = n1 + n2
        var subtracao = n1 - n2
        var multiplicacao = n1 * n2
        var divisao = n1 / n2

        document.write("A soma entre "+n1+" e "+n2+ " é: "+soma+"<br>")
        document.write("A subtração entre "+n1+" e "+n2+ " é: "+subtracao+"<br>")
        document.write("A multiplicação entre "+n1+" e "+n2+ " é: "+multiplicacao+"<br>")
        document.write("A divisão entre "+n1+" e "+n2+ " é: "+divisao+"<br>")
    </script>
</body>
</html>
