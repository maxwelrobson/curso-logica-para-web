<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<!--
Encontrar a solução de uma raiz quadrada é
encontrar os possíveis valores de x. O valor
de delta influencia totalmente no resultado final.

delta < 0 : não possui raízes reais.
delta = 0 : possui apenas uma raiz.
delta > 0 : possui duas raízes

Faça um programa que encontre as raízes. Faça
delta como uma funcão.
-->
<body>
    |<script>
        alert("Cálculo da Equação do 2º grau!")

        function calculaDelta(a, b, c) {
            return(b*b - 4*a*c)
        }

        let a =prompt("Digite o valor de a: ")
        let b =prompt("Digite o valor de b: ")
        let c =prompt("Digite o valor de c: ")

        let delta = calculaDelta(a , b ,c)

        document.write("O valor de delta é: "+delta+"<br>")

        if (delta < 0) {
            document.write("Esta equação não possui raízes reais!")
        } else {
            if (delta == 0) {
                let raiz1 = (-b + Math.sqrt(delta)) / (2 * a)
                document.write("Esta equação possui apenas 1 raíz " + raiz1)
            } else {
                let raiz1 =  (-b + Math.sqrt(delta)) / (2 * a)
                let raiz2 =  (-b - Math.sqrt(delta)) / (2 * a)
                document.write("Esta equação possui duas raízes: " + raiz1 + " e " + raiz2)
            }
        }
    </script>

</body>
</html>
