<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>

        var nome = prompt("Digite o nome: ")
        var idade =+prompt("Digite a idade: ")
        var categoria

        switch (idade) {
            case 5:
            case 6:
            case 7:
            case 8:
            case 9:
            case 10:
                categoria = "Infantil"                    
                break;
            
            case 11:
            case 12:
            case 13:
            case 14:
            case 15:
                categoria = "Juvenil"                    
                break;
             
            case 16:
            case 17:
            case 18:
            case 19:
            case 20:
                categoria = "Junior"                    
                break;
                
            case 21:
            case 22:
            case 23:
            case 24:
            case 25:
                categoria = "Profissional"                    
                break;    
        
            default:
                categoria = "Não possui"
                break;
        }

        if (idade >= 5 && idade <= 25) {
            document.write("Parabéns "+nome+" sua categoria é: "+categoria+".")
        } else {
            document.write("Olá "+nome+" não temos categorias para a sua idade.")
        }
    </script>
</body>
</html>
