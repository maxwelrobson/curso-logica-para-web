<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var saldo = prompt("Escreva o saldo: ")

if (saldo >= 10000) {
    document.write("Viajem para a Europa!")
} else if (saldo < 10000 && saldo >= 3000) {
    document.write("Viajem no Brasil!")
} else {
    document.write("Fique em casa!!")
}
    </script>
</body>
</html>
