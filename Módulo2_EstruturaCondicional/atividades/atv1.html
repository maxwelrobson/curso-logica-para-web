<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var num = +prompt("Digite o número: ")

        if (num >= 1) {
            document.write("Número positivo.")
        } else if (num == 0){
            document.write("Número neutro")
        } else {
            document.write("Número negativo")
        }
    </script>
</body>
</html>
