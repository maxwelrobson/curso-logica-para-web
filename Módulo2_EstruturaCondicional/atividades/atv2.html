<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var salario = +prompt("Digite o salário: ")
        var finan = +prompt("Digite o valor do financiamento: ")

        if (finan <= salario * 5) {
            document.write("Financimento Concedido<br>")
            document.write("Obrigado por nos consultar")
        } else {
            document.write("Financimento Negado<br>")
            document.write("Obrigado por nos consultar")
        }

    </script>
</body>
</html>
