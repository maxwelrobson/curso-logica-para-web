<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var a = +prompt("Digite o valor do lado a: ")
        var b = +prompt("Digite o valor do lado b: ")
        var c = +prompt("Digite o valor do lado c: ")

            if ( (a+b) > c && (a+c) > b && (b+c) > a) {

              if ( a == b && b == c) {
                document.write("Triângulo Equilátero")
                } else if ( a != b && b != c && a != c) {
                    document.write("Triângulo Escaleno")
                } else {
                    document.write("Triângulo Isósceles")
                }
            } else {
                document.write("Não é um triângulo válido! Os lados não fecham uma forma.")
            }
    </script>
</body>
</html>
