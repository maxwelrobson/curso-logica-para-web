<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var a = +prompt("Digite o valor de a: ")
        var b = +prompt("Digite o valor de b: ")
        var c = +prompt("Digite o valor de c: ")

        if ( a == b) {
            var resultado1 = "O valor de A é igual a B<br>"
        } else {
            var resultado1 = "O valor de A não é igual a B<br>"
        }

        if ( a > b) {
            var resultado2 = "O valor de A é maior que B<br>"
        } else {
            var resultado2 = "O valor de A não é maior que B<br>"
        }

        if ( a >= b) {
            var resultado3 = "O valor de A é maior ou igual a B<br>"
        } else {
            var resultado3 = "O valor de A não é maior ou igual a B<br>"
        }

        if ( c < b) {
            var resultado4 = "O valor de C é menor que o valor de B<br>"
        } else {
            var resultado4 = "O valor de C não é menor que o valor de B<br>"
        }

        if ( c!=b) {
            var resultado5 = "O valor de C é diferente de B<br>"
        } else {
            var resultado5 = "O valor de C não é diferente de B<br>"
        }

        document.write(resultado1)
        document.write(resultado2)
        document.write(resultado3)
        document.write(resultado4)
        document.write(resultado5)

        
    </script>
</body>
</html>
