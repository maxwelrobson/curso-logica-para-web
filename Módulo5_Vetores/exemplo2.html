<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        alert("Criando Vetores!")
        let vetorNum = new Array(5)
        vetorNum[0] = 1
        vetorNum[1] = 4
        vetorNum[2] = 7
        vetorNum[3] = 9
        vetorNum[4] = 2

        for (let c = 0; c < 5; c++) {
            document.write("Na posição "+ c + ", temos o valor: "+ vetorNum[c])
            document.write("<br>")
        }

        document.write("<br>*************************************<br>")

        let outroVetorNum = [2, 5, 8, 10, 3]
        for (let i = 0; i < 5; i++) {
            document.write("Na posição "+ i + ", temos o valor: "+ outroVetorNum[i])
            document.write("<br>")
        }

        document.write("<br> ******** Tamanho do Vetor *********<br>");
        document.write("O vetorNum tem tamanho: " + vetorNum.length + "<br>");
        document.write("O outroVetorNum tem tamanho: " + outroVetorNum.length + "<br>");
    </script>
</body>
</html>
