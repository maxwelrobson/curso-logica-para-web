<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<!--
Crie um algoritmo que leia um vetor de tamanho 4. Inicialize o vetor com o
usuário digitando os valores de cada elemento. Inicie a soma desse vetor com
uma variável num=10.

Regra importante: para cada rodada a variável num deve assumir o seu novo
valor, ou seja, o seu valor atual mais o elemento digitado na posição anterior.
-->
<body>
    <script>
        let vetor = Array(4)
        let num = 10

        for (let i = 0; i < vetor.length; i++) {
            vetor[i] = +prompt("Digite o elemento "+ i +" :")
            num = num +vetor[i]
            alert("A soma com o elemento " + i + " é : "+ num)
        }
    </script>
</body>
</html>
