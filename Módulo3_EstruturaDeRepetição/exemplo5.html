<!--
O Algoritmo média dos
alunos pode ser reescrito
de uma forma mais
prática.
-->

<body>
    <script>
        alert("Analisador de Alunos! ");
        var quantidade = +prompt("Digite a quantidade de alunos: ")
        var aluno;
        var contador = 1;
        var nota1, nota2, nota3;

        while (contador <= quantidade) {
            aluno = prompt("Digite o nome do aluno: ");
            nota1 = +prompt("Digite a nota da prova 1: ");
            nota2 = +prompt("Digite a nota da prova 2: ");
            nota3 = +prompt("Digite a nota da prova 3: ");
            var media = (nota1 + nota2 + nota3) / 3;
            document.write("A média do aluno " + aluno + " é: " + media.toFixed(1) + "<br>");
            document.write("----------------------------------------------------------<br>");
            contador = contador + 1;
        }    
    </script>   I
</body>
</html>
