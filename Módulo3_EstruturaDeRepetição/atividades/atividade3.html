<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<!--
Escreva um programa para ler as
coordenadas (X,Y) de uma quantidade
indeterminada de pontos no sistema
cartesiano. Para cada ponto escrever o
quadrante a que ele pertence. O
algoritmo será encerrado quando pelo
menos uma das duas coordenadas for
NULA. Nesta situação escreva
uma mensagem "Algoritmo
Interrompido !! ".
-->

<body>
    <script>
        alert("Verificador de Cuandrantes!")
        var contadorCoordenadas = 1

        do {
            alert("Digite os pontos da "+contadorCoordenadas+"ª coordenada.")
            contadorCoordenadas++

            var x = +prompt("Digite o valor de X:")
            var y = +prompt("Digite o valor de Y:")

            var tipoQuadrante

            if (x > 0 && y > 0) {
                tipoQuadrante = "Cuadrante 1"
            } else if (x < 0 && y > 0) {
                tipoQuadrante = "Cuadrante 2"
            } else if (x < 0 && y < 0) {
                tipoQuadrante = "Cuadrante 3"
            } else if (x > 0 && y < 0) {
                tipoQuadrante = "Cuadrante 4"
            } else {
                tipoQuadrante = "Nulo"
            }


            switch (tipoQuadrante) {
                case "Nulo":
                    document.write("O ponto ("+x+","+y+") é Nulo!<br>")
                    document.write("Algoritmo Interrompido!<br>")
                    break;
            
                case "Cuadrante 1":
                    document.write("O ponto ("+x+","+y+") pertence a o "+tipoQuadrante+"<br>")
                    break;

                case "Cuadrante 2":
                    document.write("O ponto ("+x+","+y+") pertence a o "+tipoQuadrante+"<br>")
                    break;
                    
                case "Cuadrante 3":
                    document.write("O ponto ("+x+","+y+") pertence a o "+tipoQuadrante+"<br>")
                    break;
                    
                case "Cuadrante 4":
                    document.write("O ponto ("+x+","+y+") pertence a o "+tipoQuadrante+"<br>")
                    break;    
            }
            
        } while (tipoQuadrante != "Nulo");
    </script>
</body>
</html>
