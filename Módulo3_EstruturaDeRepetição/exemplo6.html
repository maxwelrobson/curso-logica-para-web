<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<!--
Faça um algoritmo que
escreva os números de 0
a 9.
-->

<body>
    <script>
        var contador = 0

        do {
            document.write(contador)
            contador++
        } while (contador <= 9);
    </script>
</body>
</html>
