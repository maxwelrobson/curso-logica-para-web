<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<!-- Suponha um algoritmo
que conte de 0 até 10.
Escreva uma frase
quando terminar de
contar. -->

<body>
    <script>
        var num = 0

        while (num <= 10) {
            document.write(num+"\n")
            num++
        }

        document.write("Finalizado a contagem")
    </script>
</body>
</html>
